<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR NQAL - ماسح الباركود</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#1d6fe0;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ea;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2a2e37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2a2e37;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;max-width:560px;margin-inline:auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
video,#reader{width:100%;height:100%;object-fit:cover;display:block}
#reader video{object-fit:cover}
.frame{position:absolute;inset:18% 8%;border:3px solid rgba(255,255,255,.8);border-radius:12px;pointer-events:none}
#msg{margin:10px 0;padding:14px;border-radius:12px;text-align:center;font-weight:700;font-size:20px;background:var(--card);border:1px solid var(--bd);min-height:56px;display:flex;align-items:center;justify-content:center;direction:ltr}
#msg.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
#msg.dup{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.row{display:flex;gap:8px;margin:8px 0}
button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--bad)}
.cnt{color:var(--mut);margin:6px 2px;font-size:14px}
.list{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;max-height:34vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mut)}
td.c{direction:ltr;font-family:ui-monospace,Menlo,monospace}
tr.hl td{background:rgba(220,38,38,.25)}
.credit{margin:16px 0 8px;padding:12px;text-align:center;border-top:1px solid var(--bd);color:var(--mut);font-size:13px;line-height:1.8}
.credit b{color:var(--tx);font-size:14px}
.credit .en{direction:ltr;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;text-align:center}
.box p{margin:0 0 14px;font-size:17px;line-height:1.6}
</style>
</head>
<body>
<h1>📦 مسح الباركود</h1>
<div class="cam"><video id="v" playsinline muted></video><div id="reader" style="display:none"></div><div class="frame"></div></div>
<div id="msg">وجّه الكاميرا على الباركود</div>
<div class="cnt" id="cnt"></div>
<div class="list"><table><thead><tr><th>مسلسل</th><th>الباركود</th><th>الوقت</th><th>التاريخ</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row"><button class="p" id="exp">تصدير Excel</button></div>
<div class="row"><button id="undo">حذف آخر واحد</button><button class="d" id="clr">جلسة جديدة</button></div>

<div class="credit"><div>تصميم <b>ME مصطفى النوبي أبو سلمى</b></div><div class="en">Designed by <b>ME Mostafa El-Nobi Abu Salma</b></div></div>

<div class="ov" id="ov"><div class="box"><p id="ovt"></p><div class="row"><button class="p" id="cont">كمّل على القديم</button><button id="newb">ابدأ جديد</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
var KEY="qrnqal_session_v1";
var rows=[],sessDate="",started=false,lastCode="",lastAt=0,AC=null;
var $=function(i){return document.getElementById(i)};
function p2(n){return String(n).padStart(2,"0")}
function today(){var d=new Date();return p2(d.getDate())+"-"+p2(d.getMonth()+1)+"-"+d.getFullYear()}
function nowT(){var d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())}
function save(){try{localStorage.setItem(KEY,JSON.stringify({date:sessDate,rows:rows}))}catch(e){}}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}

function render(hl){
  var tb=$("tb");tb.innerHTML="";
  for(var i=rows.length-1;i>=0;i--){
    var r=rows[i],tr=document.createElement("tr");
    if(hl===i)tr.className="hl";
    [i+1,r.code,r.time,r.date].forEach(function(v,k){var td=document.createElement("td");if(k===1)td.className="c";td.textContent=v;tr.appendChild(td)});
    tb.appendChild(tr);
  }
  $("cnt").textContent="العدد: "+rows.length;
}
function show(t,c){var m=$("msg");m.textContent=t;m.className=c||""}

function beep(freq,dur,type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=freq;g.gain.value=.25;
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function okSound(){beep(1100,.12)}
function dupSound(){beep(220,.25,"square");setTimeout(function(){beep(220,.25,"square")},320);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function onCode(raw){
  var code=String(raw||"").trim();
  if(!/^[JR]/i.test(code))return;            // يقبل فقط اللي يبدأ بـ J أو R
  code=code.toUpperCase();
  var t=Date.now();
  if(code===lastCode&&t-lastAt<2500){lastAt=t;return}  // نفس الكود لسه قدام الكاميرا
  lastCode=code;lastAt=t;
  var idx=rows.findIndex(function(r){return r.code===code});
  if(idx>=0){dupSound();show("مكرر ⚠️  "+code,"dup");render(idx);return}
  rows.push({code:code,time:nowT(),date:today()});
  save();okSound();show(code,"ok");render();
}

/* ---- الكاميرا ---- */
async function startCam(){
  if(started)return;started=true;
  try{
    if("BarcodeDetector" in window){
      var fm=["code_128","code_39","code_93","ean_13","ean_8","itf","codabar","upc_a","upc_e","qr_code","data_matrix"];
      try{var sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(function(f){return sup.indexOf(f)>=0})}catch(e){}
      var det=new BarcodeDetector({formats:fm});
      var v=$("v");
      var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
      v.srcObject=st;await v.play();
      var busy=false;
      setInterval(async function(){
        if(busy||v.readyState<2)return;busy=true;
        try{var r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}catch(e){}
        busy=false;
      },200);
    }else{
      $("v").style.display="none";$("reader").style.display="block";
      var h=new Html5Qrcode("reader");
      await h.start({facingMode:"environment"},{fps:10},function(t){onCode(t)},function(){});
    }
  }catch(e){
    show("تعذّر فتح الكاميرا. اسمح للمتصفح باستخدام الكاميرا ثم أعد التحميل.","dup");
  }
}

/* ---- التصدير ---- */
$("exp").onclick=async function(){
  if(!rows.length){show("مفيش بيانات للتصدير","");return}
  var aoa=[["مسلسل","الباركود","الوقت","التاريخ"]];
  rows.forEach(function(r,i){aoa.push([i+1,r.code,r.time,r.date])});
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:8},{wch:24},{wch:12},{wch:14}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  var name="qr nqal "+today()+".xlsx";
  var blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    show("تم الحفظ: "+name,"ok");
  }catch(e){show("تعذّر الحفظ","dup")}
};
$("undo").onclick=function(){if(!rows.length)return;rows.pop();lastCode="";save();render();show("تم حذف آخر باركود","")};
$("clr").onclick=function(){
  if(!rows.length){return}
  if(confirm("تبدأ جلسة جديدة؟ حمّل ملف الإكسل الأول لو محتاجه.")){rows=[];sessDate=today();lastCode="";save();render();show("جلسة جديدة","")}
};

/* ---- بداية الجلسة ---- */
function ask(){
  var s=load();
  sessDate=today();
  if(s&&s.rows&&s.rows.length&&s.date===today()){
    rows=s.rows;render();
    $("ovt").textContent="فيه جلسة النهارده فيها "+rows.length+" باركود. تكمل عليها ولا تبدأ جديدة؟";
    $("ov").className="ov on";
    $("cont").onclick=function(){$("ov").className="ov";startCam()};
    $("newb").onclick=function(){rows=[];save();render();$("ov").className="ov";startCam()};
  }else{
    rows=[];save();render();
    $("ovt").textContent="ابدأ مسح باركود جديد";
    $("ov").className="ov on";
    $("newb").style.display="none";
    $("cont").textContent="ابدأ";
    $("cont").onclick=function(){$("ov").className="ov";startCam()};
  }
}
ask();
})();
</script>
</body>
</html>
